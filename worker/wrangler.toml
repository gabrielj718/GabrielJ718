name = "gb-home-rentals-leads"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of sites allowed to post leads. Set this to your real domain(s).
ALLOWED_ORIGINS = "https://gbhomerentals.com,https://www.gbhomerentals.com"
FUB_SYSTEM = "GBHomeRentals"
# AI chat (Gemini). Store the key as a secret, never here: npx wrangler secret put GEMINI_API_KEY
# Check Google's current model list and change this if the model is retired.
GEMINI_MODEL = "gemini-2.5-flash"
# Shown to the AI so it can give visitors your number.
PHONE_DISPLAY = "(850) 555-0123"
